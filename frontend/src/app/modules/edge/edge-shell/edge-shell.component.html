<div style="display:flex;flex-direction:column;height:calc(100vh / var(--app-zoom));min-height:calc(820px / var(--app-zoom));background:var(--bg-app);overflow-x:auto;overflow-y:hidden;position:relative;">
  <!-- ====== TOP BAR ====== -->
  <header style="flex:0 0 auto;height:58px;min-width:1300px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--surface-glass);backdrop-filter:var(--glass-blur);border-bottom:1px solid var(--border);position:relative;z-index:2;">
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:flex;align-items:baseline;gap:7px;">
        <span style="font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--text-xl);letter-spacing:var(--tracking-tight);color:var(--text);">UVSS</span>
        <span style="font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:var(--text-xs);color:var(--accent);letter-spacing:.08em;text-transform:uppercase;">Edge</span>
      </div>
      <div style="width:1px;height:24px;background:var(--border);"></div>
      <span style="display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);border-radius:var(--radius-full);padding:5px 12px;font-size:var(--text-xs);color:var(--text);"><span style="width:6px;height:6px;border-radius:var(--radius-full);background:var(--status-online);"></span>BNS Issa Khan</span>
    </div>

    <!-- Live-scan banner — the design shows it on the console screen only. -->
    <div *ngIf="onConsole" style="display:flex;align-items:center;gap:12px;">
      <span style="display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-full);padding:4px 11px;font-family:var(--font-display);font-weight:var(--fw-semibold);font-size:11px;color:var(--green-400);background:rgb(34 197 94 / .12);border:1px solid rgb(34 197 94 / .35);"><span style="width:6px;height:6px;border-radius:var(--radius-full);background:currentColor;animation:pulse 1.4s infinite;"></span>Scanning</span>
      <span style="font-family:var(--font-mono);font-size:var(--text-xs);color:var(--text-muted);font-variant-numeric:tabular-nums;">SCAN #A-2291 · VEHICLE IN PIT</span>
    </div>

    <div style="display:flex;align-items:center;gap:14px;">
      <span style="display:inline-flex;align-items:center;gap:7px;font-size:var(--text-xs);color:var(--text-muted);"><i class="fa-solid fa-lock" style="color:var(--status-online);"></i>Tunnel up</span>
      <div style="width:1px;height:22px;background:var(--border);"></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;">
        <span style="font-size:var(--text-xs);font-weight:var(--fw-semibold);color:var(--text);">R. Ahmed</span>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-faint);font-variant-numeric:tabular-nums;">14:32:08 · 25 JUN 2026</span>
      </div>
      <div style="width:32px;height:32px;border-radius:var(--radius-full);background:var(--brand);color:var(--text-on-brand);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:var(--fw-bold);font-size:var(--text-xs);">RA</div>
      <!-- Settings and sign-out now live in the rail's bottom slot. -->
      <span class="chrome-btn" (click)="theme.toggle()" [title]="theme.toggleLabel"><i class="fa-solid" [ngClass]="theme.toggleIcon"></i></span>
    </div>
  </header>

  <!-- ====== BODY ====== -->
  <div style="flex:1 1 auto;display:flex;min-height:0;min-width:1300px;">

    <!-- nav rail -->
    <nav style="flex:0 0 78px;background:var(--surface-glass);backdrop-filter:var(--glass-blur);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px;">
      <a class="rail-item" routerLink="/edge/console" routerLinkActive="active">
        <i class="fa-solid fa-circle-dot"></i><span>Live</span>
      </a>
      <a class="rail-item" routerLink="/edge/history" routerLinkActive="active">
        <i class="fa-solid fa-clock-rotate-left"></i><span>History</span>
      </a>
      <a class="rail-item" routerLink="/edge/alerts" routerLinkActive="active" style="position:relative;">
        <i class="fa-solid fa-triangle-exclamation"></i><span>Alerts</span>
        <span style="position:absolute;top:7px;right:11px;width:7px;height:7px;border-radius:var(--radius-full);background:var(--status-danger);"></span>
      </a>
      <a class="rail-item" routerLink="/edge/blacklist" routerLinkActive="active" title="Plate blacklist">
        <i class="fa-solid fa-ban"></i><span>Blacklist</span>
      </a>
      <a class="rail-item" routerLink="/edge/reports" routerLinkActive="active" title="Export reports">
        <i class="fa-solid fa-file-arrow-down"></i><span>Reports</span>
      </a>
      <div style="flex:1;"></div>
      <a class="rail-item" routerLink="/edge/system" routerLinkActive="active" title="System settings &amp; health">
        <i class="fa-solid fa-gear"></i><span>Settings</span>
      </a>
      <span class="rail-item" (click)="logout()" title="Sign out">
        <i class="fa-solid fa-arrow-right-from-bracket"></i><span>Logout</span>
      </span>
    </nav>

    <!-- routed page -->
    <router-outlet></router-outlet>
  </div>
</div>
