services:
  frontend:
    build:
      context: ./frontend
      args:
        BUILD_CONFIG: production
    container_name: uvss_frontend
    restart: unless-stopped
    networks:
      - uvss_network
    ports:
      # host 4017 → container SSR server on 4000
      - "4017:4000"

