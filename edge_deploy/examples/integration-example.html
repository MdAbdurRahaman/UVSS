<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UVSS integration example</title>
<style>
  /* Deliberately plain — this is a wiring reference, not a design.
     Copy the <script> logic into your own page and keep your own styling. */
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px;
         background: #14161a; color: #e6edf3; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b949e; font-size: 13px; margin-bottom: 18px; }
  .wrap { display: grid; grid-template-columns: minmax(0,1fr) 380px; gap: 18px; }
  @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: #1b1f26; border: 1px solid #2a303a; border-radius: 10px;
          padding: 14px; }
  #feed { width: 100%; border-radius: 8px; background: #000; display: block; }
  button { padding: 10px 18px; border: 0; border-radius: 7px; color: #fff;
           font-size: 14px; font-weight: 600; cursor: pointer; margin-right: 8px; }
  #start { background: #2ea043; } #stop { background: #f85149; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .stat { font: 12px/1.7 Consolas, monospace; color: #8b949e; margin-top: 10px; }
  .person { border: 1px solid #2a303a; border-radius: 8px; padding: 10px;
            margin-bottom: 10px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px;
         margin-bottom: 6px; }
  .row img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px;
             cursor: pointer; background: #0d0f13; }
  .row.full img { aspect-ratio: 16/9; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
         color: #8b949e; margin: 6px 0 3px; }
  video { width: 100%; border-radius: 8px; background: #000; }
</style>
</head>
<body>

<h1>UVSS edge — integration example</h1>
<div class="sub">Minimal wiring reference. Everything below uses only
  <code>uvss-client.js</code>.</div>

<div class="wrap">
  <div>
    <div class="card">
      <img id="feed" alt="live feed">
      <div style="margin-top:12px">
        <button id="start">START</button>
        <button id="stop" disabled>STOP</button>
      </div>
      <div class="stat" id="stat">connecting…</div>
    </div>

    <div class="card" id="clip-card" style="margin-top:18px; display:none">
      <div class="lbl">Recorded clip</div>
      <video id="clip" controls playsinline></video>
    </div>
  </div>

  <div class="card">
    <div class="lbl">Detected subjects</div>
    <div id="people"><em style="color:#8b949e">none yet</em></div>
  </div>
</div>

<script src="uvss-client.js"></script>
<script>
// ---------------------------------------------------------------------------
// Point this at your edge box. Leave blank to use the page's own origin.
const EDGE = "http://localhost:8000";
// ---------------------------------------------------------------------------

const uvss = new UvssClient(EDGE);
const $ = (id) => document.getElementById(id);

// 1. Live video is just an <img>.
$("feed").src = uvss.streamUrl();
$("feed").addEventListener("error", () => {
  setTimeout(() => { $("feed").src = uvss.streamUrl() + "?t=" + Date.now(); }, 1500);
});

// 2. Controls.
$("start").onclick = () => uvss.start("ui");
$("stop").onclick  = () => uvss.stop("ui");

// 3. Status ticks once a second.
uvss.on("status", (s) => {
  const active = !!s.session;
  $("start").disabled = active;
  $("stop").disabled = !active;
  $("stat").textContent =
    `${s.fps} FPS · ${s.infer_ms} ms · ${uvss.isGpu() ? "GPU" : "CPU"} · ` +
    `${s.model} · detecting ${s.classes}` +
    (active ? ` · REC ${s.session.frames} frames` : " · idle");
});

// 4. Subjects arrive as they are detected, and again when their images improve.
uvss.on("person", renderPeople);
uvss.on("started", () => { renderPeople(); $("clip-card").style.display = "none"; });

// 5. When the session stops you get the clip and the final results.
uvss.on("stopped", (session) => {
  if (session.clip_url) {
    $("clip").src = uvss.url(session.clip_url);
    $("clip-card").style.display = "";
  }
});

function renderPeople() {
  const people = uvss.people();
  if (!people.length) {
    $("people").innerHTML = '<em style="color:#8b949e">none yet</em>';
    return;
  }
  $("people").innerHTML = people.map((p) => {
    const imgs = p.images.map((im) => uvss.imageUrls(im));
    const crops = imgs.map((u) =>
      `<img src="${u.crop}" onclick="window.open('${u.crop}')">`).join("");
    // Each shot has BOTH a crop and the whole frame with boxes drawn.
    const fulls = imgs.map((u) => u.full
      ? `<img src="${u.full}" onclick="window.open('${u.full}')">` : "").join("");
    return `
      <div class="person">
        <strong>#${p.identity}</strong>
        <span style="color:#8b949e">${p.class_name} · Q ${p.best_score}</span>
        <div class="lbl">cropped</div>
        <div class="row">${crops}</div>
        <div class="lbl">whole frame</div>
        <div class="row full">${fulls}</div>
      </div>`;
  }).join("");
}

uvss.connect();
</script>
</body>
</html>
